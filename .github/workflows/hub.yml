name: Build Save Sync Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: Windows
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ''
          - platform: Linux
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: save-sync-hub/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: save-sync-hub/src-tauri -> target

      - name: Install frontend deps
        working-directory: save-sync-hub
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: save-sync-hub
          tagName: ${{ github.ref_name }}
          releaseName: Save Sync Hub ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Set these secrets to ship a properly signed release APK:
  #   ANDROID_KEYSTORE (base64), ANDROID_KEYSTORE_PASSWORD,
  #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
  # Without them the job falls back to a debug-signed APK, which sideloads fine
  # but cannot upgrade an install signed with a different key.
  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    # The desktop jobs create the draft release this APK is attached to.
    needs: build-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: save-sync-hub/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: save-sync-hub/src-tauri -> target

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Install frontend deps
        working-directory: save-sync-hub
        run: pnpm install --frozen-lockfile

      - name: Init Android project
        working-directory: save-sync-hub
        run: pnpm tauri android init

      - name: Decode signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE secret set - falling back to a debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: save-sync-hub
        run: pnpm tauri android build --apk

      # tauri leaves the release APK unsigned, and Android refuses to install
      # an unsigned package, so sign it here rather than shipping it as built.
      - name: Sign release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          UNSIGNED=$(ls save-sync-hub/src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out save-sync-hub-android.apk \
            "$RUNNER_TEMP/aligned.apk"

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        working-directory: save-sync-hub
        run: pnpm tauri android build --apk --debug

      - name: Collect debug APK
        if: steps.keystore.outputs.signed != 'true'
        run: |
          set -euo pipefail
          cp save-sync-hub/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk \
            save-sync-hub-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: save-sync-hub-android
          path: save-sync-hub-android.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp save-sync-hub-android.apk "Save.Sync.Hub_${GITHUB_REF_NAME#v}_android.apk"
          gh release upload "$GITHUB_REF_NAME" \
            "Save.Sync.Hub_${GITHUB_REF_NAME#v}_android.apk" --clobber
